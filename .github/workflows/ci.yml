name: CI

on:
  push:
    branches: [main, taller10, taller11]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            Trabajo_autonomo_Lealcaf_hito2/go.sum

      - name: Verificación y pruebas del Hito 1
        run: |
          if [ -f go.mod ]; then
            gofmt -l .
            go vet ./...
            go test ./...
          else
            echo "Aún no hay go.mod — el pipeline queda en espera (se activa como requisito en la semana 4)."
          fi

      - name: Verificación y pruebas del Hito 2
        run: |
          go -C Trabajo_autonomo_Lealcaf_hito2 vet ./...
          go -C Trabajo_autonomo_Lealcaf_hito2 test ./...
