name: lealcaf-taller11

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-lealcaf_taller11}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecute Taller11.cmd para crear la configuracion local}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      # TCP evita dar por listo al servidor temporal de inicializacion.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  api:
    image: lealcaf:taller11
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-lealcaf_taller11}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_TTL: 1h
      DEMO_DATA: "true"
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:?Falta DEMO_CLIENT_PASSWORD en .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Falta DEMO_ADMIN_PASSWORD en .env}
      GIN_MODE: release
      REPOSITORY_ADAPTER: sqlc
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
